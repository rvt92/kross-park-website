# krosspark.club nginx config (included inside the http{} block of the nginx:alpine image).
# TLS is terminated by Coolify's Traefik in front of this container; this listens on plain 80.

# Old inbound links and the Netlify-era URLs: send everything to the clean, canonical form.
map $request_uri $redirect_to {
    default                               "";
    ~^/index\.html(\?.*)?$                /;
    ~^/(?<p>.+)\.html(\?.*)?$             /$p;
    ~^/personal-training/?(\?.*)?$        /training;
}

# Cache policy by location. HTML is always revalidated; assets are versioned by content hash
# (styles.css?v=HASH) or never change (fonts, images, video), so they can be cached for a year.
map $uri $cache_control {
    default              "no-cache";
    ~^/assets/           "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($redirect_to) {
        return 301 $redirect_to;
    }

    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Clean URLs: /pickleball serves pickleball.html, /go/classes serves go/classes.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Do not serve the build tooling if it ever ends up in the image.
    location ~ ^/(build\.py|README\.md)$ { return 404; }
}
